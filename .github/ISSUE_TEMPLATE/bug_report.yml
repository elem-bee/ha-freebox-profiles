name: Problème / Bug report
description: Signaler un dysfonctionnement / Report a problem
labels: [bug]
body:
  - type: input
    id: box
    attributes:
      label: Modèle de Freebox / Freebox model
      placeholder: Delta, Pop, Ultra, Revolution...
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Version de Home Assistant / Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de l'intégration / Integration version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Ce qui se passe, et ce que vous attendiez. / What happens, and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux / Logs
      description: Activez le niveau debug pour custom_components.freebox_profiles. Masquez vos données personnelles. / Enable debug logging. Hide personal data.
      render: text
  - type: markdown
    attributes:
      value: |
        Vous pouvez joindre les diagnostics (Paramètres > Appareils et services > Freebox Profiles > ⋮ > Télécharger les diagnostics) : jetons, adresses MAC et noms y sont masqués.
