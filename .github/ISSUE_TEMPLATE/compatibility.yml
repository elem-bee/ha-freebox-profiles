name: Compatibilité / Compatibility report
description: Indiquer que l'intégration fonctionne (ou non) sur votre Freebox / Tell whether it works on your Freebox
labels: [compatibility]
body:
  - type: input
    id: box
    attributes:
      label: Modèle de Freebox / Freebox model
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Version de Freebox OS / Freebox OS version
  - type: dropdown
    id: result
    attributes:
      label: Résultat / Result
      options:
        - Tout fonctionne / Everything works
        - Lecture seule fonctionne / Reading works, changes fail
        - Ne fonctionne pas / Does not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Remarques / Notes
